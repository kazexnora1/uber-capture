<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>配達履歴</title>
<style>
  :root {
    --bg: #e9edf0;
    --surface: #ffffff;
    --ink: #14202a;
    --muted: #5b6c78;
    --line: #c9d3da;
    --good: #0e7a4f;
    --warn: #b4441f;
    --link: #1f5fa8;
    --memo: #fdf8e7;
    --memoline: #e0d3a3;
    --pick: #eef3fb;
    --pickline: #b9cdea;
    --drop: #fbeeee;
    --dropline: #e3bcbc;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", sans-serif;
    font-feature-settings: "tnum" 1;
    -webkit-text-size-adjust: 100%;
  }

  .wrap {
    max-width: 430px;
    margin: 0 auto;
    padding: 10px 12px calc(14px + env(safe-area-inset-bottom));
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 14px;
    overflow: hidden;
  }

  .card + .card { margin-top: 10px; }

  .card.swap { animation: fade .16s ease-out; }
  @keyframes fade { from { opacity: .35; } to { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) {
    .card.swap { animation: none; }
  }

  .nav {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 10px;
    border-bottom: 1px solid var(--line);
  }

  .nav button {
    flex: 0 0 auto;
    width: 46px;
    height: 40px;
    font-size: 20px;
    line-height: 1;
    color: var(--ink);
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 10px;
  }
  .nav button:disabled { opacity: .3; }
  .nav button:active:not(:disabled) { background: var(--line); }

  .stamp {
    flex: 1 1 auto;
    text-align: center;
    font-size: 13px;
    color: var(--muted);
    line-height: 1.35;
  }
  .stamp b {
    display: block;
    font-size: 15px;
    font-weight: 600;
    color: var(--ink);
  }

  .block { padding: 12px 14px; border-bottom: 1px solid var(--line); }
  .block:last-child { border-bottom: 0; }

  /* ---- ピック / ドロップ ---- */
  .stop {
    margin: 10px 14px;
    border-radius: 10px;
    border: 1px solid var(--line);
    padding: 12px 12px;
  }
  .stop.pick { background: var(--pick); border-color: var(--pickline); }
  .stop.drop { background: var(--drop); border-color: var(--dropline); }

  .stop .label {
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .stop .dot {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    flex: 0 0 auto;
  }
  .stop.pick .dot { background: var(--link); }
  .stop.drop .dot { background: var(--warn); }

  .stop-text {
    display: flex;
    align-items: flex-start;
    gap: 8px;
    margin: 6px 0 8px;
  }
  .stop-text p {
    margin: 0;
    flex: 1 1 auto;
    line-height: 1.4;
  }
  .stop.pick .stop-text p { font-size: 18px; font-weight: 600; }
  .stop.drop .stop-text p { font-size: 16px; }

  .copy {
    flex: 0 0 auto;
    width: 34px;
    height: 34px;
    border-radius: 8px;
    border: 1px solid var(--line);
    background: var(--surface);
    color: var(--muted);
    font-size: 15px;
    line-height: 1;
  }
  .copy:active { background: var(--line); }
  .copy.copied { color: var(--good); border-color: var(--good); }

  .label { font-size: 12px; color: var(--muted); margin-bottom: 4px; }

  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

  .btn {
    display: inline-block;
    padding: 9px 14px;
    font-size: 14px;
    font-weight: 500;
    color: var(--link);
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 9px;
    text-decoration: none;
    font-family: inherit;
  }
  .btn:active { background: var(--line); }

  .btn.plain {
    color: var(--muted);
    background: transparent;
    border: 0;
    padding: 9px 4px;
  }

  .btn.go {
    color: var(--surface);
    background: var(--link);
    border-color: var(--link);
  }

  .memo {
    background: var(--memo);
    border-left: 4px solid var(--memoline);
    border-radius: 0 8px 8px 0;
    padding: 10px 12px;
    font-size: 15px;
    line-height: 1.55;
    white-space: pre-wrap;
    word-break: break-word;
  }

  .memo-empty { font-size: 14px; color: var(--muted); }
  .memo-time { margin-top: 6px; font-size: 12px; color: var(--muted); }

  textarea, .field {
    width: 100%;
    padding: 10px 12px;
    font-family: inherit;
    font-size: 16px;
    line-height: 1.55;
    color: var(--ink);
    background: var(--memo);
    border: 1px solid var(--memoline);
    border-radius: 8px;
  }

  textarea { min-height: 88px; resize: vertical; }

  .field { background: var(--bg); border-color: var(--line); }
  .field::placeholder { color: var(--muted); }

  .memo-foot { margin-top: 8px; display: flex; gap: 8px; align-items: center; }
  .note { font-size: 13px; color: var(--muted); }

  .stats {
    display: flex;
    align-items: stretch;
    border-left: 4px solid var(--line);
    padding-left: 12px;
  }
  .stats.good { border-left-color: var(--good); }
  .stats.warn { border-left-color: var(--warn); }

  .stat { flex: 1 1 0; }
  .stat + .stat { padding-left: 10px; }
  .stat .k { font-size: 12px; color: var(--muted); }
  .stat .v {
    font-size: 22px;
    font-weight: 700;
    letter-spacing: -.02em;
    line-height: 1.2;
    white-space: nowrap;
  }
  .stats.good .rate .v { color: var(--good); }
  .stats.warn .rate .v { color: var(--warn); }

  .sub { margin-top: 8px; font-size: 14px; color: var(--muted); }

  .tags { margin-top: 8px; display: flex; gap: 6px; flex-wrap: wrap; }
  .tag {
    font-size: 13px;
    font-weight: 600;
    padding: 3px 9px;
    border-radius: 999px;
    background: var(--bg);
    border: 1px solid var(--line);
  }

  .empty {
    padding: 40px 20px;
    text-align: center;
    color: var(--muted);
    font-size: 15px;
    line-height: 1.6;
  }

  .finder .row { margin-top: 8px; }
  .finder .field { flex: 1 1 auto; min-width: 0; }

  :focus-visible { outline: 2px solid var(--link); outline-offset: 2px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="card" id="card"><div class="empty">読み込んでいます</div></div>

  <div class="card finder">
    <div class="block">
      <div class="label">住所検索</div>
      <form id="finderForm">
        <div class="row">
          <input class="field" id="finderInput" type="text" inputmode="search"
                 placeholder="住所や施設名を入力" autocomplete="off">
          <button class="btn go" type="submit">マップで開く</button>
        </div>
      </form>
    </div>
  </div>
</div>

<script>
/* GASのデプロイURL（Shortcutsのpostと同じもの） */
var API_URL = 'https://script.google.com/macros/s/AKfycbxcQPRdgT4niOmlhP5c6mfKZr5aeDhKqgwYBlxpUqtCT2h05zYcI6P_VD8SFWub87-gAw/exec';

var HISTORY = [];
var MEMOS = {};

var RATE_GOOD = 1500;
var RATE_WARN = 1250;

var idx = 0;
var editing = false;
var card = document.getElementById('card');

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}

function yen(n) {
  return n == null ? '—' : '¥' + Number(n).toLocaleString('ja-JP');
}

function mapsUrl(q) {
  return 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(q);
}

function searchUrl(q) {
  return 'https://www.google.com/search?q=' + encodeURIComponent(q);
}

function shortTs(ts) {
  var m = String(ts || '').match(/^\d{4}-(\d{2})-(\d{2}) (\d{2}:\d{2})$/);
  return m ? (m[1] + '/' + m[2] + ' ' + m[3]) : (ts || '');
}

function rateClass(rate) {
  if (rate == null) return '';
  if (rate >= RATE_GOOD) return 'good';
  if (rate < RATE_WARN) return 'warn';
  return '';
}

/* data-copy属性に入れた文字列をコピーする。属性経由にするのはエスケープを一箇所に集約するため */
function copyText(btn, text) {
  var reset = function () {
    btn.classList.remove('copied');
    btn.textContent = '⧉';
  };

  var done = function (ok) {
    btn.classList.toggle('copied', ok);
    btn.textContent = ok ? '✓' : '✕';
    setTimeout(reset, 1200);
  };

  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(function () { done(true); }, function () { done(false); });
    return;
  }

  // クリップボードAPIが使えない場合のフォールバック
  var ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.opacity = '0';
  document.body.appendChild(ta);
  ta.focus();
  ta.select();
  try {
    done(document.execCommand('copy'));
  } catch (err) {
    done(false);
  }
  document.body.removeChild(ta);
}

function stopBlock(kind, label, text, extraHtml) {
  var dotLabel = kind === 'pick' ? 'ピック' : 'ドロップ';
  return '<div class="stop ' + kind + '">'
    +   '<div class="label"><span class="dot"></span>' + dotLabel + '</div>'
    +   '<div class="stop-text">'
    +     '<p>' + esc(text) + '</p>'
    +     '<button class="copy" type="button" data-copy="' + esc(text) + '" aria-label="' + dotLabel + 'をコピー">⧉</button>'
    +   '</div>'
    +   (extraHtml || '')
    + '</div>';
}

function render() {
  if (!HISTORY.length) {
    card.innerHTML = '<div class="empty">まだ履歴がありません。<br>配達リクエストをキャプチャすると、ここに残ります。</div>';
    return;
  }

  var d = HISTORY[idx];
  var perKm = (d.price != null && d.km) ? Math.round(d.price / d.km) : null;
  var cls = rateClass(d.hourlyRate);

  var tags = [];
  if (d.multiplier > 1) tags.push('×' + d.multiplier + ' 同時配達');
  if (d.additional) tags.push('追加配達');

  var html = '';

  html += '<div class="nav">'
        +   '<button id="prev" aria-label="1件前">&#8592;</button>'
        +   '<div class="stamp"><b>' + esc(shortTs(d.ts)) + '</b>'
        +     (idx + 1) + ' / ' + HISTORY.length + '</div>'
        +   '<button id="next" aria-label="1件後">&#8594;</button>'
        + '</div>';

  var pickExtra = '<div class="row">'
    +   '<a class="btn" target="_blank" rel="noopener" href="'
    +     esc(mapsUrl(d.store + ' ' + (d.address || ''))) + '">マップで開く</a>'
    +   '<a class="btn" target="_blank" rel="noopener" href="'
    +     esc(searchUrl(d.store)) + '">Googleで検索</a>'
    + '</div>';
  html += stopBlock('pick', 'ピック', d.store, pickExtra);

  html += '<div class="block" id="memoBlock"></div>';

  var dropExtra = '<div class="row">'
    +   '<a class="btn" target="_blank" rel="noopener" href="'
    +     esc(mapsUrl(d.address)) + '">マップで開く</a>'
    + '</div>';
  html += stopBlock('drop', 'ドロップ', d.address, dropExtra);

  html += '<div class="block">'
        +   '<div class="stats ' + cls + '">'
        +     '<div class="stat"><div class="k">報酬</div><div class="v">' + yen(d.price) + '</div></div>'
        +     '<div class="stat rate"><div class="k">時給換算</div><div class="v">' + yen(d.hourlyRate) + '</div></div>'
        +     '<div class="stat"><div class="k">1kmあたり</div><div class="v">' + yen(perKm) + '</div></div>'
        +   '</div>'
        +   '<div class="sub">'
        +     (d.minutes != null ? d.minutes + '分' : '—')
        +     ' ・ ' + (d.km != null ? d.km + 'km' : '—')
        +   '</div>';

  if (tags.length) {
    html += '<div class="tags">';
    tags.forEach(function (t) { html += '<span class="tag">' + esc(t) + '</span>'; });
    html += '</div>';
  }

  if (d.imageId) {
    html += '<div class="row" style="margin-top:10px">'
          +   '<a class="btn plain" target="_blank" rel="noopener" href="'
          +     'https://drive.google.com/file/d/' + esc(d.imageId) + '/view">キャプチャを開く</a>'
          + '</div>';
  }

  html += '</div>';

  card.className = 'card swap';
  card.innerHTML = html;

  var prev = document.getElementById('prev');
  var next = document.getElementById('next');
  prev.disabled = (idx >= HISTORY.length - 1);
  next.disabled = (idx <= 0);
  prev.onclick = function () { go(1); };
  next.onclick = function () { go(-1); };

  card.querySelectorAll('.copy').forEach(function (btn) {
    btn.onclick = function () { copyText(btn, btn.getAttribute('data-copy')); };
  });

  renderMemo();
}

function go(step) {
  if (editing && !confirm('編集中のメモを破棄して移動しますか？')) return;
  var n = idx + step;
  if (n < 0 || n >= HISTORY.length) return;
  editing = false;
  idx = n;
  render();
}

/* ---- 店メモ ---- */

function renderMemo() {
  var d = HISTORY[idx];
  var el = document.getElementById('memoBlock');
  if (!el) return;

  var entry = MEMOS[d.store];
  var html = '<div class="label">この店のメモ</div>';

  if (entry && entry.memo) {
    html += '<div class="memo">' + esc(entry.memo) + '</div>';
    if (entry.updatedAt) {
      html += '<div class="memo-time">' + esc(entry.updatedAt) + ' 更新</div>';
    }
    html += '<div class="row" style="margin-top:8px">'
          +   '<button class="btn" id="memoEdit">メモを編集</button>'
          + '</div>';
  } else {
    html += '<p class="memo-empty">入口、駐輪場、受け取りの癖など、次に来たとき助かることを残せます。</p>'
          + '<div class="row" style="margin-top:8px">'
          +   '<button class="btn" id="memoEdit">メモを書く</button>'
          + '</div>';
  }

  el.innerHTML = html;

  var btn = document.getElementById('memoEdit');
  if (btn) btn.onclick = openEditor;
}

function openEditor() {
  var d = HISTORY[idx];
  var el = document.getElementById('memoBlock');
  var entry = MEMOS[d.store];
  var current = (entry && entry.memo) || '';

  editing = true;

  el.innerHTML = '<div class="label">この店のメモ</div>'
    + '<textarea id="memoText" placeholder="例：イオンモール3F フードコート奥。バイクは北側駐輪場が近い。"></textarea>'
    + '<div class="memo-foot">'
    +   '<button class="btn go" id="memoSave">保存</button>'
    +   '<button class="btn plain" id="memoCancel">キャンセル</button>'
    +   '<span class="note" id="memoNote"></span>'
    + '</div>';

  var ta = document.getElementById('memoText');
  ta.value = current;
  ta.focus();

  document.getElementById('memoCancel').onclick = function () {
    editing = false;
    renderMemo();
  };

  document.getElementById('memoSave').onclick = function () {
    var body = ta.value;
    var note = document.getElementById('memoNote');
    var save = document.getElementById('memoSave');

    save.disabled = true;
    note.textContent = '保存しています';

    fetch(API_URL, {
      method: 'POST',
      body: JSON.stringify({ action: 'saveMemo', args: [d.store, body] })
    })
      .then(function (r) { return r.json(); })
      .then(function (r) {
        if (r && r.status === 'saved') {
          MEMOS[d.store] = r.entry;
        } else if (r && r.status === 'deleted') {
          delete MEMOS[d.store];
        } else {
          save.disabled = false;
          note.textContent = '保存できませんでした';
          return;
        }
        editing = false;
        renderMemo();
      })
      .catch(function () {
        save.disabled = false;
        note.textContent = '保存できませんでした（通信エラー）';
      });
  };
}

/* ---- 住所検索（履歴と独立、単体の機能） ---- */

(function () {
  var form = document.getElementById('finderForm');
  var input = document.getElementById('finderInput');

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    var q = input.value.trim();
    if (!q) return;
    window.open(mapsUrl(q), '_blank', 'noopener');
  });
})();

/* 左右スワイプでも移動できるようにする */
(function () {
  var x0 = null, y0 = null;

  document.addEventListener('touchstart', function (e) {
    if (e.target.tagName === 'TEXTAREA' || e.target.tagName === 'INPUT') { x0 = null; return; }
    x0 = e.touches[0].clientX;
    y0 = e.touches[0].clientY;
  }, { passive: true });

  document.addEventListener('touchend', function (e) {
    if (x0 == null) return;
    var dx = e.changedTouches[0].clientX - x0;
    var dy = e.changedTouches[0].clientY - y0;
    if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 2) {
      go(dx > 0 ? 1 : -1);
    }
    x0 = null;
  }, { passive: true });
})();

/* 起動時にGASからデータを取得 */
fetch(API_URL + '?data=1')
  .then(function (r) { return r.json(); })
  .then(function (data) {
    HISTORY = data.history || [];
    MEMOS = data.memos || {};
    render();
  })
  .catch(function () {
    card.innerHTML = '<div class="empty">データを取得できませんでした。<br>電波状況を確認するか、時間をおいて開き直してください。</div>';
  });
</script>
</body>
</html>
