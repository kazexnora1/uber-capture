<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<style>
  :root {
    --bg: #e9edf0;
    --surface: #ffffff;
    --ink: #14202a;
    --muted: #5b6c78;
    --line: #c9d3da;
    --good: #0e7a4f;
    --warn: #b4441f;
    --link: #1f5fa8;
    --memo: #fdf8e7;
    --memoline: #e0d3a3;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", sans-serif;
    font-feature-settings: "tnum" 1;
    -webkit-text-size-adjust: 100%;
  }

  .wrap {
    max-width: 430px;
    margin: 0 auto;
    padding: 10px 12px calc(14px + env(safe-area-inset-bottom));
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 14px;
    overflow: hidden;
  }

  .card.swap { animation: fade .16s ease-out; }
  @keyframes fade { from { opacity: .35; } to { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) {
    .card.swap { animation: none; }
  }

  /* ---- ヘッダー ---- */
  .nav {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 10px;
    border-bottom: 1px solid var(--line);
  }

  .nav button {
    flex: 0 0 auto;
    width: 46px;
    height: 40px;
    font-size: 20px;
    line-height: 1;
    color: var(--ink);
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 10px;
  }
  .nav button:disabled { opacity: .3; }
  .nav button:active:not(:disabled) { background: var(--line); }

  .stamp {
    flex: 1 1 auto;
    text-align: center;
    font-size: 13px;
    color: var(--muted);
    line-height: 1.35;
  }
  .stamp b {
    display: block;
    font-size: 15px;
    font-weight: 600;
    color: var(--ink);
  }

  /* ---- 本体 ---- */
  .block { padding: 12px 14px; border-bottom: 1px solid var(--line); }
  .block:last-child { border-bottom: 0; }

  .label { font-size: 12px; color: var(--muted); margin-bottom: 4px; }

  .store {
    font-size: 19px;
    font-weight: 600;
    line-height: 1.3;
    letter-spacing: .01em;
    margin: 0 0 10px;
  }

  .addr {
    font-size: 16px;
    line-height: 1.45;
    margin: 0 0 10px;
  }

  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

  .btn {
    display: inline-block;
    padding: 9px 14px;
    font-size: 14px;
    font-weight: 500;
    color: var(--link);
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 9px;
    text-decoration: none;
    font-family: inherit;
  }
  .btn:active { background: var(--line); }

  .btn.plain {
    color: var(--muted);
    background: transparent;
    border: 0;
    padding: 9px 4px;
  }

  .btn.go {
    color: var(--surface);
    background: var(--link);
    border-color: var(--link);
  }

  /* ---- 店メモ ---- */
  .memo {
    background: var(--memo);
    border-left: 4px solid var(--memoline);
    border-radius: 0 8px 8px 0;
    padding: 10px 12px;
    font-size: 15px;
    line-height: 1.55;
    white-space: pre-wrap;
    word-break: break-word;
  }

  .memo-empty {
    font-size: 14px;
    color: var(--muted);
  }

  .memo-time {
    margin-top: 6px;
    font-size: 12px;
    color: var(--muted);
  }

  textarea {
    width: 100%;
    min-height: 88px;
    padding: 10px 12px;
    font-family: inherit;
    font-size: 16px;
    line-height: 1.55;
    color: var(--ink);
    background: var(--memo);
    border: 1px solid var(--memoline);
    border-radius: 8px;
    resize: vertical;
  }

  .memo-foot {
    margin-top: 8px;
    display: flex;
    gap: 8px;
    align-items: center;
  }

  .note { font-size: 13px; color: var(--muted); }

  /* ---- 数字 ---- */
  .stats {
    display: flex;
    align-items: stretch;
    border-left: 4px solid var(--line);
    padding-left: 12px;
  }
  .stats.good { border-left-color: var(--good); }
  .stats.warn { border-left-color: var(--warn); }

  .stat { flex: 1 1 0; }
  .stat + .stat { padding-left: 10px; }
  .stat .k { font-size: 12px; color: var(--muted); }
  .stat .v {
    font-size: 22px;
    font-weight: 700;
    letter-spacing: -.02em;
    line-height: 1.2;
    white-space: nowrap;
  }
  .stats.good .rate .v { color: var(--good); }
  .stats.warn .rate .v { color: var(--warn); }

  .sub {
    margin-top: 8px;
    font-size: 14px;
    color: var(--muted);
  }

  .tags { margin-top: 8px; display: flex; gap: 6px; flex-wrap: wrap; }
  .tag {
    font-size: 13px;
    font-weight: 600;
    padding: 3px 9px;
    border-radius: 999px;
    background: var(--bg);
    border: 1px solid var(--line);
  }

  .empty {
    padding: 40px 20px;
    text-align: center;
    color: var(--muted);
    font-size: 15px;
    line-height: 1.6;
  }

  :focus-visible { outline: 2px solid var(--link); outline-offset: 2px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="card" id="card"></div>
</div>

<script>
var HISTORY = /*__HISTORY__*/[];
var MEMOS = /*__MEMOS__*/{};

var RATE_GOOD = 1500;
var RATE_WARN = 1250;

var idx = 0;
var editing = false;
var card = document.getElementById('card');

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}

function yen(n) {
  return n == null ? '—' : '¥' + Number(n).toLocaleString('ja-JP');
}

function mapsUrl(q) {
  return 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(q);
}

function searchUrl(q) {
  return 'https://www.google.com/search?q=' + encodeURIComponent(q);
}

function shortTs(ts) {
  var m = String(ts || '').match(/^\d{4}-(\d{2})-(\d{2}) (\d{2}:\d{2})$/);
  return m ? (m[1] + '/' + m[2] + ' ' + m[3]) : (ts || '');
}

function rateClass(rate) {
  if (rate == null) return '';
  if (rate >= RATE_GOOD) return 'good';
  if (rate < RATE_WARN) return 'warn';
  return '';
}

function render() {
  if (!HISTORY.length) {
    card.innerHTML = '<div class="empty">まだ履歴がありません。<br>配達リクエストをキャプチャすると、ここに残ります。</div>';
    return;
  }

  var d = HISTORY[idx];
  var perKm = (d.price != null && d.km) ? Math.round(d.price / d.km) : null;
  var cls = rateClass(d.hourlyRate);

  var tags = [];
  if (d.multiplier > 1) tags.push('×' + d.multiplier + ' 同時配達');
  if (d.additional) tags.push('追加配達');

  var html = '';

  html += '<div class="nav">'
        +   '<button id="prev" aria-label="1件前">&#8592;</button>'
        +   '<div class="stamp"><b>' + esc(shortTs(d.ts)) + '</b>'
        +     (idx + 1) + ' / ' + HISTORY.length + '</div>'
        +   '<button id="next" aria-label="1件後">&#8594;</button>'
        + '</div>';

  html += '<div class="block">'
        +   '<div class="label">ピック</div>'
        +   '<p class="store">' + esc(d.store) + '</p>'
        +   '<div class="row">'
        +     '<a class="btn" target="_blank" rel="noopener" href="'
        +       esc(mapsUrl(d.store + ' ' + (d.address || ''))) + '">マップで開く</a>'
        +     '<a class="btn" target="_blank" rel="noopener" href="'
        +       esc(searchUrl(d.store)) + '">Googleで検索</a>'
        +   '</div>'
        + '</div>';

  html += '<div class="block" id="memoBlock"></div>';

  html += '<div class="block">'
        +   '<div class="label">ドロップ</div>'
        +   '<p class="addr">' + esc(d.address) + '</p>'
        +   '<div class="row">'
        +     '<a class="btn" target="_blank" rel="noopener" href="'
        +       esc(mapsUrl(d.address)) + '">マップで開く</a>'
        +   '</div>'
        + '</div>';

  html += '<div class="block">'
        +   '<div class="stats ' + cls + '">'
        +     '<div class="stat"><div class="k">報酬</div><div class="v">' + yen(d.price) + '</div></div>'
        +     '<div class="stat rate"><div class="k">時給換算</div><div class="v">' + yen(d.hourlyRate) + '</div></div>'
        +     '<div class="stat"><div class="k">1kmあたり</div><div class="v">' + yen(perKm) + '</div></div>'
        +   '</div>'
        +   '<div class="sub">'
        +     (d.minutes != null ? d.minutes + '分' : '—')
        +     ' ・ ' + (d.km != null ? d.km + 'km' : '—')
        +   '</div>';

  if (tags.length) {
    html += '<div class="tags">';
    tags.forEach(function (t) { html += '<span class="tag">' + esc(t) + '</span>'; });
    html += '</div>';
  }

  if (d.imageId) {
    html += '<div class="row" style="margin-top:10px">'
          +   '<a class="btn plain" target="_blank" rel="noopener" href="'
          +     'https://drive.google.com/file/d/' + esc(d.imageId) + '/view">キャプチャを開く</a>'
          + '</div>';
  }

  html += '</div>';

  card.className = 'card swap';
  card.innerHTML = html;

  var prev = document.getElementById('prev');
  var next = document.getElementById('next');
  prev.disabled = (idx >= HISTORY.length - 1);
  next.disabled = (idx <= 0);
  prev.onclick = function () { go(1); };
  next.onclick = function () { go(-1); };

  renderMemo();
}

function go(step) {
  if (editing && !confirm('編集中のメモを破棄して移動しますか？')) return;
  var n = idx + step;
  if (n < 0 || n >= HISTORY.length) return;
  editing = false;
  idx = n;
  render();
}

/* ---- 店メモ ---- */

function renderMemo() {
  var d = HISTORY[idx];
  var el = document.getElementById('memoBlock');
  if (!el) return;

  var entry = MEMOS[d.store];
  var html = '<div class="label">この店のメモ</div>';

  if (entry && entry.memo) {
    html += '<div class="memo">' + esc(entry.memo) + '</div>';
    if (entry.updatedAt) {
      html += '<div class="memo-time">' + esc(entry.updatedAt) + ' 更新</div>';
    }
    html += '<div class="row" style="margin-top:8px">'
          +   '<button class="btn" id="memoEdit">メモを編集</button>'
          + '</div>';
  } else {
    html += '<p class="memo-empty">入口、駐輪場、受け取りの癖など、次に来たとき助かることを残せます。</p>'
          + '<div class="row" style="margin-top:8px">'
          +   '<button class="btn" id="memoEdit">メモを書く</button>'
          + '</div>';
  }

  el.innerHTML = html;

  var btn = document.getElementById('memoEdit');
  if (btn) btn.onclick = openEditor;
}

function openEditor() {
  var d = HISTORY[idx];
  var el = document.getElementById('memoBlock');
  var entry = MEMOS[d.store];
  var current = (entry && entry.memo) || '';

  editing = true;

  el.innerHTML = '<div class="label">この店のメモ</div>'
    + '<textarea id="memoText" placeholder="例：イオンモール3F フードコート奥。バイクは北側駐輪場が近い。"></textarea>'
    + '<div class="memo-foot">'
    +   '<button class="btn go" id="memoSave">保存</button>'
    +   '<button class="btn plain" id="memoCancel">キャンセル</button>'
    +   '<span class="note" id="memoNote"></span>'
    + '</div>';

  var ta = document.getElementById('memoText');
  ta.value = current;
  ta.focus();

  document.getElementById('memoCancel').onclick = function () {
    editing = false;
    renderMemo();
  };

  document.getElementById('memoSave').onclick = function () {
    var body = ta.value;
    var note = document.getElementById('memoNote');
    var save = document.getElementById('memoSave');

    save.disabled = true;
    note.textContent = '保存しています';

    google.script.run
      .withSuccessHandler(function (r) {
        if (r && r.status === 'saved') {
          MEMOS[d.store] = r.entry;
        } else if (r && r.status === 'deleted') {
          delete MEMOS[d.store];
        } else {
          save.disabled = false;
          note.textContent = '保存できませんでした';
          return;
        }
        editing = false;
        renderMemo();
      })
      .withFailureHandler(function () {
        save.disabled = false;
        note.textContent = '保存できませんでした';
      })
      .apiSaveMemo(d.store, body);
  };
}

/* 左右スワイプでも移動できるようにする */
(function () {
  var x0 = null, y0 = null;

  document.addEventListener('touchstart', function (e) {
    if (e.target.tagName === 'TEXTAREA') { x0 = null; return; }
    x0 = e.touches[0].clientX;
    y0 = e.touches[0].clientY;
  }, { passive: true });

  document.addEventListener('touchend', function (e) {
    if (x0 == null) return;
    var dx = e.changedTouches[0].clientX - x0;
    var dy = e.changedTouches[0].clientY - y0;
    if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 2) {
      go(dx > 0 ? 1 : -1);
    }
    x0 = null;
  }, { passive: true });
})();

render();
</script>
</body>
</html>
